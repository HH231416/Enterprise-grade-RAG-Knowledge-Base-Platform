apiVersion: v1
kind: Secret
metadata:
  name: rag-system-secrets
  namespace: rag-system
type: Opaque
stringData:
  APP_API_KEY: replace-with-secret-manager-value
  INTERNAL_TOKEN: replace-with-secret-manager-value
  DATABASE_URL: postgresql+psycopg://rag_app:replace-with-password@postgres-ha.platform.svc:5432/oa_rag
  REDIS_URL: redis://:replace-with-password@redis-ha.platform.svc:6379/0
  CELERY_BROKER_URL: redis://:replace-with-password@redis-ha.platform.svc:6379/1
  CELERY_RESULT_BACKEND: redis://:replace-with-password@redis-ha.platform.svc:6379/2
  OPENSEARCH_USERNAME: rag_app
  OPENSEARCH_PASSWORD: replace-with-secret-manager-value
  EMBEDDING_API_BASE: https://embedding.example.internal/v1
  EMBEDDING_API_KEY: replace-with-secret-manager-value
  EMBEDDING_MODEL: replace-with-embedding-model
  LLM_API_BASE: https://llm.example.internal/v1
  LLM_API_KEY: replace-with-secret-manager-value
  LLM_MODEL: replace-with-answer-model
  ANSWER_JUDGE_MODEL: replace-with-judge-model
