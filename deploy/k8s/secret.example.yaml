apiVersion: v1
kind: Secret
metadata:
  name: rag-system-secrets
  namespace: rag-system
type: Opaque
stringData:
  APP_API_KEY: replace-with-secret-manager-value
  INTERNAL_TOKEN: replace-with-secret-manager-value
  DATABASE_URL: postgresql+psycopg://rag_app:replace-with-password@postgres-ha.platform.svc:5432/oa_rag
  REDIS_URL: redis://:replace-with-password@redis-ha.platform.svc:6379/0
  CELERY_BROKER_URL: redis://:replace-with-password@redis-ha.platform.svc:6379/1
  CELERY_RESULT_BACKEND: redis://:replace-with-password@redis-ha.platform.svc:6379/2
  OPENSEARCH_USERNAME: rag_app
  OPENSEARCH_PASSWORD: replace-with-secret-manager-value
  # TEI OpenAI-compatible endpoint. Replace the Service name with the campus AI platform endpoint.
  EMBEDDING_API_BASE: http://tei-embedding.ai-platform.svc.cluster.local/v1
  EMBEDDING_API_KEY: replace-with-tei-service-token
  EMBEDDING_MODEL: BAAI/bge-m3
  # Campus TEI reranker. This service is separate from the embedding endpoint.
  RERANK_API_KEY: replace-with-reranker-service-token
  # vLLM OpenAI-compatible endpoint. Replace the Service name with the campus AI platform endpoint.
  LLM_API_BASE: http://vllm-qwen3.ai-platform.svc.cluster.local:8000/v1
  LLM_API_KEY: replace-with-vllm-service-token
  LLM_MODEL: Qwen/Qwen3-14B
  ANSWER_JUDGE_MODEL: Qwen/Qwen3-14B
  PADDLE_OCR_API_BASE: http://paddleocr.ai-platform.svc.cluster.local/v1/ocr
  PADDLE_OCR_TOKEN: replace-with-paddleocr-service-token
  MULTIMODAL_API_BASE: http://vllm-qwen3-vl.ai-platform.svc.cluster.local:8000/v1
  MULTIMODAL_API_KEY: replace-with-vllm-vl-service-token
  MULTIMODAL_MODEL: Qwen/Qwen2.5-VL-7B-Instruct
