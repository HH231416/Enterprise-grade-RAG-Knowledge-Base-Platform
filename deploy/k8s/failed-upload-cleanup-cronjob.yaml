apiVersion: batch/v1
kind: CronJob
metadata:
  name: rag-failed-upload-cleanup
  namespace: rag-system
  labels:
    app.kubernetes.io/name: rag-failed-upload-cleanup
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rag-failed-upload-cleanup
        spec:
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: enqueue-cleanup
              image: registry.example.com/rag-system:replace-with-version
              command:
                - celery
                - -A
                - app.tasks.evaluation_tasks.celery_app
                - call
                - knowledge_base.cleanup_expired_failed_uploads
              envFrom:
                - configMapRef:
                    name: rag-system-config
                - secretRef:
                    name: rag-system-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
