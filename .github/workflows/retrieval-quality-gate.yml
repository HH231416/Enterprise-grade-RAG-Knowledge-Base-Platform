name: Retrieval Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  retrieval-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Enforce deterministic retrieval quality thresholds
        run: python scripts/retrieval_quality_gate.py

      - name: Verify quality gate behavior
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest -q tests/test_retrieval_quality_gate.py
